<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foodics Training POS</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}
body{
  background:#f4f6f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.login{
  background:white;
  padding:40px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
  width:350px;
  text-align:center;
}
h1{
  color:#00b14f;
  margin-bottom:25px;
}
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}
button{
  padding:12px;
  background:#00b14f;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  transition:.3s;
}
button:hover{
  background:#009944;
}
#login button{
  width:100%;
  font-size:18px;
}
#pos{
  display:none;
  width:100%;
  height:100vh;
}
.layout{
  display:flex;
  height:100%;
}
.sidebar{
  width:220px;
  background:#202733;
  color:white;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.sidebar h2{
  margin-bottom:10px;
}
.sidebar button{
  background:#2c3443;
  text-align:right;
  width:100%;
}
.sidebar button.active{
  background:#00b14f;
}
.main{
  flex:1;
  padding:20px;
  overflow-y:auto;
}
.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-top:15px;
}
.card{
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
  cursor:pointer;
  text-align:center;
  user-select:none;
}
.card:hover{
  background:#00b14f;
  color:white;
}
.cart{
  width:300px;
  background:white;
  padding:20px;
  box-shadow:-3px 0 10px rgba(0,0,0,.1);
  display:flex;
  flex-direction:column;
}
.cart h2{
  margin-bottom:15px;
}
#items{
  flex:1;
  overflow-y:auto;
}
.item-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid #eee;
}
.item-row button{
  background:#e74c3c;
  padding:4px 10px;
  font-size:14px;
}
.item-row button:hover{
  background:#c0392b;
}
.total{
  font-size:22px;
  margin-top:15px;
  color:#00b14f;
  display:flex;
  justify-content:space-between;
}
.clear-btn{
  margin-top:15px;
  background:#555;
}
.clear-btn:hover{
  background:#333;
}
.print-btn{
  margin-top:10px;
  background:#2980b9;
}
.print-btn:hover{
  background:#1f618d;
}
.add-product-box{
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
  margin-bottom:15px;
}
.add-product-box h3{
  margin-bottom:10px;
  color:#00b14f;
}
.add-product-box .row{
  display:flex;
  gap:10px;
}
.add-product-box input,
.add-product-box select{
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:14px;
  flex:1;
}
.add-product-box button{
  margin-top:10px;
  width:100%;
}

/* منطقة الرسيت المخفية - تظهر فقط عند الطباعة */
#receipt{
  display:none;
}
@media print{
  body *{
    visibility:hidden;
  }
  #receipt, #receipt *{
    visibility:visible;
  }
  #receipt{
    display:block;
    position:absolute;
    top:0;
    left:0;
    width:100%;
    padding:20px;
    font-family:Arial,sans-serif;
  }
  #receipt h2{
    text-align:center;
    margin-bottom:10px;
    color:#000;
  }
  #receipt table{
    width:100%;
    border-collapse:collapse;
    margin:10px 0;
  }
  #receipt td, #receipt th{
    padding:5px;
    text-align:right;
    border-bottom:1px dashed #000;
  }
  #receipt .receipt-total{
    font-size:18px;
    font-weight:bold;
    margin-top:10px;
    text-align:left;
  }
}
</style>
</head>
<body>

<div class="login" id="login">
  <h1>Foodics Training</h1>
  <input type="text" id="user" placeholder="اسم المستخدم">
  <input type="password" id="pass" placeholder="كلمة المرور">
  <button id="loginBtn">دخول</button>
</div>

<div id="pos">
  <div class="layout">
    <div class="sidebar">
      <h2>الأقسام</h2>
      <button class="cat-btn active" data-cat="all">الكل</button>
      <button class="cat-btn" data-cat="Coffee">Coffee</button>
      <button class="cat-btn" data-cat="Cold Drinks">Cold Drinks</button>
      <button class="cat-btn" data-cat="Desserts">Desserts</button>
      <button class="cat-btn" data-cat="Sandwiches">Sandwiches</button>
    </div>

    <div class="main">
      <div class="add-product-box">
        <h3>إضافة صنف جديد</h3>
        <div class="row">
          <input type="text" id="newName" placeholder="اسم الصنف">
          <input type="number" id="newPrice" placeholder="السعر EGP">
          <select id="newCat">
            <option value="Coffee">Coffee</option>
            <option value="Cold Drinks">Cold Drinks</option>
            <option value="Desserts">Desserts</option>
            <option value="Sandwiches">Sandwiches</option>
          </select>
        </div>
        <button id="addProductBtn">إضافة الصنف</button>
      </div>
      <h2>المنتجات</h2>
      <div class="products" id="products"></div>
    </div>

    <div class="cart">
      <h2>الطلب</h2>
      <div id="items"></div>
      <div class="total">
        <span>الإجمالي</span>
        <span><span id="total">0</span> EGP</span>
      </div>
      <button class="print-btn" id="printBtn">طباعة الرسيت</button>
      <button class="clear-btn" id="clearBtn">مسح الطلب</button>
    </div>
  </div>
</div>

<!-- منطقة الرسيت، تظهر بس وقت الطباعة -->
<div id="receipt">
  <h2>Foodics Training POS</h2>
  <p id="receiptDate"></p>
  <table>
    <thead>
      <tr><th>الصنف</th><th>السعر</th></tr>
    </thead>
    <tbody id="receiptItems"></tbody>
  </table>
  <div class="receipt-total">الإجمالي: <span id="receiptTotal">0</span> EGP</div>
  <p style="text-align:center;margin-top:15px;">شكراً لزيارتكم</p>
</div>

<script>
// بيانات المنتجات مع تحديد القسم لكل منتج
const products = [
  { name: "Latte", price: 110, icon: "☕", cat: "Coffee" },
  { name: "Cappuccino", price: 95, icon: "☕", cat: "Coffee" },
  { name: "Espresso", price: 70, icon: "☕", cat: "Coffee" },
  { name: "Mocha", price: 125, icon: "☕", cat: "Coffee" },
  { name: "Cheesecake", price: 120, icon: "🍰", cat: "Desserts" },
  { name: "Brownie", price: 90, icon: "🍫", cat: "Desserts" },
];

let cart = [];
let currentCat = "all";

const productsEl = document.getElementById("products");
const itemsEl = document.getElementById("items");
const totalEl = document.getElementById("total");

function renderProducts() {
  productsEl.innerHTML = "";
  const list = currentCat === "all"
    ? products
    : products.filter(p => p.cat === currentCat);

  if (list.length === 0) {
    productsEl.innerHTML = "<p>لا يوجد منتجات في هذا القسم</p>";
    return;
  }

  list.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div>${p.icon}</div><h3>${p.name}</h3><p>${p.price} EGP</p>`;
    card.addEventListener("click", () => addToCart(p));
    productsEl.appendChild(card);
  });
}

function addToCart(product) {
  cart.push(product);
  renderCart();
}

function removeFromCart(index) {
  cart.splice(index, 1);
  renderCart();
}

function renderCart() {
  itemsEl.innerHTML = "";
  let total = 0;
  cart.forEach((item, index) => {
    total += item.price;
    const row = document.createElement("div");
    row.className = "item-row";
    row.innerHTML = `<span>${item.name} - ${item.price} EGP</span>`;
    const removeBtn = document.createElement("button");
    removeBtn.textContent = "حذف";
    removeBtn.addEventListener("click", () => removeFromCart(index));
    row.appendChild(removeBtn);
    itemsEl.appendChild(row);
  });
  totalEl.textContent = total;
}

document.querySelectorAll(".cat-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentCat = btn.dataset.cat;
    renderProducts();
  });
});

document.getElementById("clearBtn").addEventListener("click", () => {
  cart = [];
  renderCart();
});

// إضافة صنف جديد للمنتجات
document.getElementById("addProductBtn").addEventListener("click", () => {
  const nameInput = document.getElementById("newName");
  const priceInput = document.getElementById("newPrice");
  const catInput = document.getElementById("newCat");

  const name = nameInput.value.trim();
  const price = parseFloat(priceInput.value);
  const cat = catInput.value;

  if (!name || isNaN(price) || price <= 0) {
    alert("من فضلك اكتب اسم صحيح وسعر أكبر من صفر");
    return;
  }

  products.push({ name, price, icon: "🆕", cat });
  nameInput.value = "";
  priceInput.value = "";

  // لو الصنف في نفس القسم المعروض حالياً، تظهر الشبكة تحدث فوراً
  if (currentCat === "all" || currentCat === cat) {
    renderProducts();
  }
});

// طباعة الرسيت
document.getElementById("printBtn").addEventListener("click", () => {
  if (cart.length === 0) {
    alert("السلة فارغة، ضيف أصناف الأول");
    return;
  }

  const receiptItems = document.getElementById("receiptItems");
  receiptItems.innerHTML = "";
  let total = 0;
  cart.forEach(item => {
    total += item.price;
    receiptItems.innerHTML += `<tr><td>${item.name}</td><td>${item.price} EGP</td></tr>`;
  });

  document.getElementById("receiptTotal").textContent = total;
  document.getElementById("receiptDate").textContent = new Date().toLocaleString("ar-EG");

  window.print();
});

document.getElementById("loginBtn").addEventListener("click", () => {
  document.getElementById("login").style.display = "none";
  document.getElementById("pos").style.display = "block";
  renderProducts();
  renderCart();
});
</script>
</body>
</html>
